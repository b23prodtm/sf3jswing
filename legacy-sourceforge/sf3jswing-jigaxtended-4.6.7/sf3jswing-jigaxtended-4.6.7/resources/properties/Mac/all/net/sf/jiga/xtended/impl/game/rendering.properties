# Platform Specific Rendering settings (RenderingScene.java resourcebundle)
#
# graphics
lwjglEnabled=true
#   OpenGL Scratch Buffer names available for each entity 
#   (textures, vertex- and pixel-buffer objects)
_GLScratchCapacity=100
# turn on (true) to disable openGL extensions (_EXT), such as GL_TEXTURE_RECTANGLE_EXT
_GLdisableEXT=false
_GLdisableFX=false
# 0 : any, 1 : fullscreen-exclusive, 2 : window-exclusive
exclMode=0
showFPSEnabled=true
# interactive RenderingScene with keyboard options (F1 : help, F2 : console, F4 : fullscreen-switch, ...)
interactiveOptions=true
# sound
openALEnabled=true
_ALBufferCapacity=100
# FIXES
FIXclearBlitSprite=true
