# YOU DON T NEED TO EDIT THIS FILE MANUALLY
# IT IS FILTERED AND COPIED TO THE RESOURCES/PROPERTIES/OS.NAME/OS.ARCH AUTOMATICALLY BY THE BUILD SCRIPT (SEE BUID-OS.NAME-OS.ARCH.XML FOR
# CONFIGURATION TOKENS)
# specify the name (or part of the beggining) of the targeted OS
os=Windows
#recommended if your operating systems uses writeable user Extensions paths (e.g. Mac OS X /Library/Java/Extensions/)
useSystemExtensionsPaths=false
# specify the native libraries to install
# syntax is : nativeName:resourcePathToLibraryFile{:load}
# load is default to false which will not call System.load()
# seperate with " " (one blank space)
extNatives=clib_jiio:/clib_jiio.dll clib_jiio_sse2:/clib_jiio_sse2.dll clib_jiio_util:/clib_jiio_util.dll jinput-dx8_64:/jinput-dx8_64.dll jinput-dx8:/jinput-dx8.dll jinput-raw_64:/jinput-raw_64.dll jinput-raw:/jinput-raw.dll jinput-wintab:/jinput-wintab.dll lwjgl64:/lwjgl64.dll lwjgl:/lwjgl.dll mlib_jai:/mlib_jai.dll mlib_jai_mmx:/mlib_jai_mmx.dll mlib_jai_util:/mlib_jai_util.dll OpenAL64:/OpenAL64.dll OpenAL32:/OpenAL32.dll jdic:/jdic.dll tray:/tray.dll jmacm:/jmacm.dll jmam:/jmam.dll jmcvid:/jmcvid.dll jmdaud:/jmdaud.dll jmdaudc:/jmdaudc.dll jmddraw:/jmddraw.dll jmfjawt:/jmfjawt.dll jmg723:/jmg723.dll jmgdi:/jmgdi.dll jmgsm:/jmgsm.dll jmh261:/jmh261.dll jmh263enc:/jmh263enc.dll jmmci:/jmmci.dll jmmpa:/jmmpa.dll jmmpegv:/jmmpegv.dll jmutil:/jmutil.dll jmvcm:/jmvcm.dll jmvfw:/jmvfw.dll jmvh263:/jmvh263.dll jsound:/jsound.dll

# ONLY FOR APPLETS : here should be the extension JARS you want to install in ${java.home}/lib/ext
#seperate jar resources filenames by " " (one blank space)
#Please use full qualified class-loader resources paths !
extPathURL=http://sf3jswing.sourceforge.net//api/
extJars=sf3jswing-jigaxtended-Windows-x86-ext-native_signed.jar sf3jswing-jigaxtended-Windows-x86-ext-props_signed.jar sf3jswing-jigaxtended-Windows-x86-ext-lib_signed.jar sf3jswing-jigaxtended-Windows-x86-ext_signed.jar
# Java SE installer
extInstallerJar=sf3jswing-jigaxtended-Windows-x86-ext-kernel_signed.jar
# optional Java Applet installer
appletInstallerURL=http://sf3jswing.sourceforge.net//api//sf3jswing-jigaxtended-Windows-x86-kernel.html
# name for the installer application
installerAppName=Setup JXA.bat
